# PLAYLINE 테마와 서버 설정
[server]
# 업로드 파일 하나당 최대 크기(MB). playline/analysis.py 의 MAX_FILE_MB 와 같게 유지
maxUploadSize = 50
# 서버(Streamlit Cloud)에서 첫 실행 이메일 입력을 기다리며 멈추지 않도록 headless 로 실행.
# 로컬에서는 브라우저에서 http://localhost:8501 을 직접 연다.
headless = true

[browser]
gatherUsageStats = false

[theme]
# 짙은 밤하늘 배경 + 홀로그램 CD 포인트 색
base = "dark"
primaryColor = "#6C7BFF"
backgroundColor = "#07080C"
secondaryBackgroundColor = "#141722"
textColor = "#EEF0F5"
borderColor = "#2A2F3D"
linkColor = "#7CF7FF"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "999px"
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap, sans-serif"
headingFont = "Noto Sans KR, sans-serif"
codeFont = "monospace"
baseFontSize = 15
chartCategoricalColors = ["#7CF7FF", "#FF7AD9", "#A98BFF", "#FFC46B"]
